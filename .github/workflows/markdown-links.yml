name: Markdown links

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verifier regression tests
        shell: pwsh
        run: ./tests/Test-MarkdownLinks.Tests.ps1
      - name: Verify repository-relative Markdown links
        shell: pwsh
        run: ./scripts/Test-MarkdownLinks.ps1
